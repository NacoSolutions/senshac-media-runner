name: Publish Media Runner Container

on:
  push:
    branches: [main]
    paths:
      - ".flox/**"
      - ".github/workflows/publish-media-runner.yml"
      - "bun.lock"
      - "package.json"
      - "scripts/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nacosolutions/senshac-media-runner

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: flox/install-flox-action@v2

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immutable image
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          CONTAINER_RUNTIME=docker scripts/build-media-runner "${image}:sha-${GITHUB_SHA}"

      - name: Record rollback digest
        id: rollback
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          if docker pull "${image}:latest"; then
            digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${image}:latest")"
          else
            digest="none (first publication)"
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Push immutable image
        run: docker push "${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}"

      - name: Verify registry artifact
        id: immutable
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          immutable="${image}:sha-${GITHUB_SHA}"
          docker image rm "${immutable}"
          docker pull "${immutable}"
          docker run --rm "${immutable}" help
          docker run --rm --entrypoint sh "${immutable}" -lc '
            command -v bun
            command -v ffmpeg
            command -v pyftsubset
            bun -e "await import(\"sharp\")"
          '
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${immutable}")"
          case "$digest" in *@sha256:*) ;; *) exit 1 ;; esac
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Promote verified image
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          immutable="${image}:sha-${GITHUB_SHA}"
          docker tag "${immutable}" "${image}:latest"
          docker push "${image}:latest"
          docker image rm "${image}:latest"
          docker pull "${image}:latest"
          latest="$(docker inspect --format '{{index .RepoDigests 0}}' "${image}:latest")"
          test "$latest" = "${{ steps.immutable.outputs.digest }}"

      - name: Record publication
        run: |
          {
            echo "## Media runner publication"
            echo
            echo "- Immutable: \`${{ steps.immutable.outputs.digest }}\`"
            echo "- Previous latest: \`${{ steps.rollback.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
