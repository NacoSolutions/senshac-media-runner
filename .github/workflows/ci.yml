name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Validate media runner contract
        run: |
          test -s AGENTS.md
          test -s docs/media-runner-image.md
          test -x scripts/build-media-runner
          test -x scripts/media-runner
